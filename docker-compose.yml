services:
  postgres:
    image: postgres:15
    container_name: parking_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - parking-network

  mongo:
    image: mongo:6.0
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - parking-network
      
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672" 
      - "15672:15672" 
    volumes:
      - ./rabbitmq-definitions.json:/etc/rabbitmq/definitions.json
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"
    networks:
      - parking-network
      
  discover-service:
    build:
      context: ./discover-service
      dockerfile: Dockerfile
    container_name: discover-service
    ports:
      - "8761:8761"
    networks:
      - parking-network

  ms-mail:
    build:
      context: ./mail-ms
      dockerfile: Dockerfile
    container_name: ms-mail
    env_file:
      - ./mail-ms/.env
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discover-service:8761/eureka/
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/email
    ports:
      - "8082:8082"
    depends_on:
      - discover-service
      - mongo
      - rabbitmq
    networks:
      - parking-network

  ms-user:
    build:
      context: ./user-ms
      dockerfile: Dockerfile
    container_name: ms-user
    env_file:
      - ./user-ms/.env
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discover-service:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      - discover-service
      - postgres
      - rabbitmq
    networks:
      - parking-network      
      
  ms-parking:
    build:
      context: ./parking-ms
      dockerfile: Dockerfile
    container_name: ms-parking
    env_file:
      - ./parking-ms/.env
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discover-service:8761/eureka/
    ports:
      - "8081:8081"
    depends_on:
      - discover-service
      - postgres
      - rabbitmq
    networks:
      - parking-network
      
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discover-service:8761/eureka/
    ports:
      - "8079:8079"
    depends_on:
      - discover-service
    networks:
      - parking-network
      
volumes:
  rabbitmq-data:
    driver: local
  postgres_data:
  mongo_data:

networks:
  parking-network:
